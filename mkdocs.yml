site_name: Entitybase
site_description: Documentation for the Entitybase monorepo
repo_url: https://github.com/Entitybasedev/entitybase-monorepo

site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber

markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - 🏠 Overview: index.md
  - 🚀 Running the stack: services.md
  - 🛠️ Development: development.md
  - 📚 System docs:
      - Backend Overview: backend-overview.md
      - Getting Started: GETTING_STARTED.md
      - Tutorial: TUTORIAL.md
      - Glossary: GLOSSARY.md
      - Endpoints: ENDPOINTS.md
      - Port Reference: PORTS.md
      - FAQ: FAQ.md
      - Backend Development: DEVELOPMENT-backend.md
      - Value Proposition: VALUE_PROPOSITION.md
  - 🏗️ Architecture:
      - Architecture: ARCHITECTURE/ARCHITECTURE.md
      - Entity Model: ARCHITECTURE/ENTITY-MODEL.md
      - Database Schema: ARCHITECTURE/DATABASE_SCHEMA.md
      - Repositories: ARCHITECTURE/REPOSITORIES.md
      - API Models: ARCHITECTURE/API_MODELS.md
      - Entitybase JSON: ARCHITECTURE/ENTITYBASE-JSON.md
      - Conceptual Model: ARCHITECTURE/CONCEPTUAL-MODEL.md
      - Concurrency Control: ARCHITECTURE/CONCURRENCY-CONTROL.md
      - Caching Strategy: ARCHITECTURE/CACHING-STRATEGY.md
      - Change Streaming: ARCHITECTURE/CHANGE-STREAMING/CHANGE-NOTIFICATION.md
      - Frontend Integration: ARCHITECTURE/FRONTEND-INTEGRATION-GUIDE.md
      - Entitybase Import: ARCHITECTURE/ENTITYBASE-IMPORT.md
      - Services: ARCHITECTURE/SERVICES.md
      - Workers: ARCHITECTURE/WORKERS.md
      - Parser: ARCHITECTURE/PARSER/INTERNAL-REPRESENTATION.md
  - ⚙️ Features:
      - Endorsements: features/ENDORSEMENTS.md
      - Endpoints: features/ENDPOINTS.md
      - Entity Protection: features/ENTITY-PROTECTION.md
      - Immutable Revisions: features/IMMUTABLE-REVISIONS.md
      - Lexeme Support: features/LEXEME-SUPPORT.md
      - Thanks: features/THANKS.md
