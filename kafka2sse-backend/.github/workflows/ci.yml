name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d

      - name: Wait for services
        run: sleep 20

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
- uses: astral-sh/setup-uv@v5
      - run: uv sync --no-install-project

      - name: Run ruff
        run: uv run ruff check .

      - name: Run unit tests
        run: uv run pytest src/tests/unit/ -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Run contract tests (fuzz)
        run: uv run pytest src/tests/contract/ -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Run integration tests
        run: timeout 60 uv run pytest src/tests/integration/ -v --cov=src --cov-report=term-missing --cov-report=xml || true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: kafka2sse-backend

      - name: Stop services
        if: always()
        run: docker compose down
