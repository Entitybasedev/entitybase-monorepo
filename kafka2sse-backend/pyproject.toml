[project]
name = "kafka2sse"
version = "0.1.0"
description = "A reusable Kafka → SSE gateway"
authors = [{name = "Entitybase Team"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "sse-starlette>=2.0",
    "aiokafka>=0.10",
    "confluent-kafka>=2.4",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.32",
    "valkey>=6.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
