[project]
name = "kafka2sse"
version = "0.1.0"
description = "A reusable Kafka → SSE gateway"
authors = [{name = "Entitybase Team"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "sse-starlette>=2.0",
    "aiokafka>=0.10",
    "confluent-kafka>=2.4",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.32",
    "valkey>=6.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# BLE001/S110: broad excepts that log are intentional at kafka/sse boundaries
# EXE002: executable bit set on modules without shebangs is fine
ignore = ["BLE001", "S110", "EXE002"]

[tool.ruff.lint.per-file-ignores]
# tests: exception-object conventions and naive datetimes are not worth enforcing
"tests/**" = ["TRY002", "TRY401", "DTZ001"]

[tool.pytest.ini_options]
markers = [
    "contract: API response-shape conformance tests (no external services)",
]
