[project]
name = "json_dump_worker"
version = "0.1.0"
description = "Writes periodic JSON dumps of the entity store."
authors = [{name = "Entitybase Team"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "entitybase-backend",
]

[tool.uv.sources]
# The worker shares the backend's data layer for now; it talks to the
# database directly and does not import the API.
entitybase-backend = { path = "../entitybase-backend" }

[tool.hatch.build.targets.wheel]
packages = ["src/json_dump_worker"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../entitybase-backend/src"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: unit tests",
    "integration: tests that need a running database",
]
