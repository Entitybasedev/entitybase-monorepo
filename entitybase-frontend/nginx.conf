server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Change stream SSE (kafka2sse backend) - must precede the generic /v1 rule
    location /v1/streams {
        proxy_pass http://kafka2sse-backend:8888;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    location /v1/topics {
        proxy_pass http://kafka2sse-backend:8888;
        proxy_set_header Host $host;
    }

    location /k2s/ {
        proxy_pass http://kafka2sse-backend:8888/;
        proxy_set_header Host $host;
    }

    # Entitybase API
    location /v1 {
        proxy_pass http://entitybase-api:8080;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://entitybase-api:8080;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://entitybase-api:8080;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://entitybase-api:8080/health;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
