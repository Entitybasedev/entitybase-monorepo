services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_DATABASE: entitybase
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysql", "-uroot", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 512m
    cpus: 0.5

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    command: /data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ACCESS_KEY=fakekey
      - RUSTFS_SECRET_KEY=fakesecret
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ADDRESS=:9001
    volumes:
      - /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.5

  redpanda:
    image: redpandadata/redpanda:v25.3.6
    container_name: redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health && rpk topic list"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: "1.5g"
    cpus: "1.0"

  create-buckets:
    container_name: create-buckets
    build:
      context: .
      dockerfile: docker/containers/Dockerfile.api
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: fakekey
      S3_SECRET_KEY: fakesecret
      PYTHONPATH: /app/src
    depends_on:
      rustfs:
        condition: service_healthy
    command: python -m models.workers.dev buckets setup
    mem_limit: 512m
    cpus: 0.5

  create-tables:
    build:
      context: .
      dockerfile: docker/containers/Dockerfile.api
    container_name: create-tables
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "sleep 20 && python -m models.workers.dev tables setup"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: entitybase
      DB_USER: root
      DB_PASSWORD: ""
    mem_limit: 512m
    cpus: 0.5

  create-topics:
    build:
      context: .
      dockerfile: docker/containers/Dockerfile.api
    container_name: create-topics
    depends_on:
      redpanda:
        condition: service_healthy
    command: python -m models.workers.dev topics setup
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_ENTITY_CHANGE_TOPIC: entitybase.entity_change
      KAFKA_ENTITY_DIFF_TOPIC: entitybase.entity_diff
    mem_limit: 512m
    cpus: 0.5

volumes:
  redpanda-data: {}