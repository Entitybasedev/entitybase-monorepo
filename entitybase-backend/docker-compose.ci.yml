services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_DATABASE: entitybase
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysql", "-uroot", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 512m
    cpus: 0.5

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    command: /data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ACCESS_KEY=fakekey
      - RUSTFS_SECRET_KEY=fakesecret
      - RUSTFS_ADDRESS=:9000
      - RUSTFS_CONSOLE_ADDRESS=:9001
    volumes:
      - /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 0.5

  redpanda:
    image: redpandadata/redpanda:v25.3.6
    container_name: redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:9092,HOST://0.0.0.0:9094
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092,HOST://localhost:9094
    ports:
      - "9092:9092"
      - "9094:9094"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy'"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: "1.5g"
    cpus: "1.0"

  api:
    build:
      context: .
      dockerfile: docker/containers/Dockerfile.api
    container_name: api
    ports:
      - "8000:8000"
    depends_on:
      rustfs:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      DB_TYPE: mysql
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: fakekey
      S3_SECRET_KEY: fakesecret
      S3_BUCKET: testbucket
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: entitybase
      DB_USER: root
      DB_PASSWORD: ""

      ENTITY_JSON_VERSION: "2.0.0"
      S3_REVISION_VERSION: "3.0.0"
      S3_STATEMENT_VERSION: "1.0.0"
      S3_QUALIFIER_VERSION: "1.0.0"
      S3_REFERENCE_VERSION: "1.0.0"
      S3_SNAK_VERSION: "1.0.0"
      S3_SITELINK_VERSION: "1.0.0"
      STREAMING_ENTITYCHANGE_VERSION: "1.0.0"
      STREAMING_ENDORSECHANGE_VERSION: "1.0.0"
      STREAMING_NEWTHANK_VERSION: "1.0.0"
      STREAMING_ENTITY_CHANGE_VERSION: "1.0.0"
      STREAMING_ENTITY_DIFF_VERSION: "2.0.0"

      STREAMING_ENABLED: "true"
      KAFKA_BROKERS: redpanda:9092
      KAFKA_ENTITY_CHANGE_TOPIC: entity_change
      KAFKA_ENTITY_DIFF_TOPIC: entitybase.entity_diff
      LOG_LEVEL: "DEBUG"
      ENVIRONMENT: "dev"
      USER_AGENT: "Entitybase/1.0 User:So9q"
      CI: "true"
    command: uvicorn models.rest_api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 1g
    cpus: 1.0

volumes:
  redpanda-data: {}