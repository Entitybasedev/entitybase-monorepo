# Entitybase Docker Orchestration
#
# Ports:
#   mysql:            3306
#   redpanda:         9092 (Kafka), 9644 (admin)
#   entitybase-api:   8083
#   kafka2sse-be:     8888
#
# Usage:
#   just up           # build images and start everything
#   docker compose up -d

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: entitybase
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    healthcheck:
      test: ["CMD", "mysql", "-uroot", "-p${MYSQL_ROOT_PASSWORD}", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 512m
    cpus: 0.5
    networks:
      - entitybase-network

  valkey:
    image: valkey/valkey:latest
    container_name: valkey
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - entitybase-network

  redpanda:
    image: redpandadata/redpanda:v25.3.6
    container_name: redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp 1
      - --memory 256M
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    environment:
      - KAFKA_RETENTION_BYTES=${REDPANDA_RETENTION_BYTES:-10485760}
      - KAFKA_RETENTION_MS=${REDPANDA_RETENTION_MS:-3600000}
      - KAFKA_LOG_SEGMENT_BYTES=${REDPANDA_LOG_SEGMENT_BYTES:-10485760}
      - REDPANDA_LOG_SEGMENT_MAX_BYTES=${REDPANDA_LOG_SEGMENT_BYTES:-10485760}
    # ports:
    #   - "9092:9092"
    #   - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health && rpk topic list"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    cpus: 0.25
    networks:
      - entitybase-network
    user: ${REDPANDA_USER:-root}
    volumes:
      - ${VOLUMES_PATH}/redpanda-data:/var/lib/redpanda/data

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: meilisearch
    environment:
      # No master key: the stack runs without search auth. Set
      # MEILI_MASTER_KEY and MEILISEARCH_API_KEY for a protected instance.
      MEILI_ENV: development
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - entitybase-network

  entitybase-api:
    container_name: entitybase-api
    image: entitybase-api:latest
    ports:
      - "8083:8080"
    environment:
      - VERSION=${VERSION_ENTITYBASE_BACKEND}
      - DB_TYPE=mariadb
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=entitybase
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-}
      - STREAMING_ENABLED=true
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_ENTITY_CHANGE_TOPIC=${KAFKA_ENTITY_CHANGE_TOPIC:-entity_change}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - AUTH_TOKEN_EXPIRY_HOURS=${AUTH_TOKEN_EXPIRY_HOURS:-168}
      # Import a small demo dataset (1 item, 1 property, 1 lexeme) when the
      # instance is empty, so a fresh demo stack is not blank
      - DEMO_SEED_ENABLED=${DEMO_SEED_ENABLED:-true}
      # Search: the API reads the Meilisearch index the indexer worker writes
      - MEILISEARCH_ENABLED=true
      - MEILISEARCH_HOST=meilisearch
      - MEILISEARCH_PORT=7700
      - MEILISEARCH_INDEX=entitybase
    depends_on:
      mysql:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    # Long start_period needed to initialize redpanda producers when STREAMING_ENABLED=true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 100s
    mem_limit: 1g
    cpus: 1.0
    # The api races mysql's TCP listener on recreations; retry until it accepts
    restart: unless-stopped
    networks:
      - entitybase-network

  entitybase-frontend:
    container_name: entitybase-frontend
    image: entitybase-frontend:latest
    ports:
      - "8080:8080"
    depends_on:
      entitybase-api:
        condition: service_started
      kafka2sse-backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 128m
    cpus: 0.25
    networks:
      - entitybase-network

  kafka2sse-backend:
    container_name: kafka2sse-backend
    image: kafka2sse-backend:latest
    ports:
      - "8888:8888"
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - VALKEY_HOST=valkey
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - VERSION=${VERSION_KAFKA2SSE_BACKEND}
    depends_on:
      redpanda:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8888/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    cpus: 0.5
    networks:
      - entitybase-network

  # A DokuWiki with the Entitybase plugin, for writing documentation that
  # refers to items: {{entity>Q42}} renders the item's label.
  dokuwiki:
    container_name: dokuwiki
    image: dokuwiki/dokuwiki:stable
    ports:
      - "8082:8080"
    volumes:
      # The plugin, and the settings that point it at the API. Mounting
      # local.php replaces the one the wiki generates, which is what makes this
      # work without a manual install step.
      - ./plugin-dokuwiki/entitybase:/var/www/html/lib/plugins/entitybase:ro
      - ./plugin-dokuwiki/dokuwiki/local.php:/var/www/html/conf/local.php:ro
    depends_on:
      entitybase-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 256m
    cpus: 0.25
    networks:
      - entitybase-network

  meilisearch-indexer-worker:
    container_name: meilisearch-indexer-worker
    build:
      context: .
      dockerfile: meilisearch_indexer_worker/Dockerfile
    ports:
      - "8009:8009"
    environment:
      - MEILISEARCH_ENABLED=true
      - MEILISEARCH_HOST=meilisearch
      - MEILISEARCH_PORT=7700
      - MEILISEARCH_INDEX=entitybase
      - MEILISEARCH_CONSUMER_GROUP=entitybase-meilisearch-indexer
      # The index starts empty: index what already exists before following the
      # change stream, so search works right after startup
      - MEILISEARCH_REINDEX_ON_START=true
      - DB_TYPE=mariadb
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=entitybase
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-}
      - STREAMING_ENABLED=true
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_ENTITY_CHANGE_TOPIC=${KAFKA_ENTITY_CHANGE_TOPIC:-entity_change}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      entitybase-api:
        condition: service_started
      meilisearch:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8009/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    networks:
      - entitybase-network

networks:
  entitybase-network:
    name: entitybase-network

volumes:
  redpanda-data:
