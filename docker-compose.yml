# Entitybase Docker Orchestration
#
# Ports:
#   mysql:            3306
#   minio:            9000 (API), 9001 (console)
#   redpanda:         9092 (Kafka), 9644 (admin)
#   entitybase-api:   8083
#   kafka2sse-be:     8888
#   orchestrator-fe:  8080
#
# Usage:
#   just up           # build images and start everything
#   docker compose up -d

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: entitybase
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    healthcheck:
      test: ["CMD", "mysql", "-uroot", "-p${MYSQL_ROOT_PASSWORD}", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 512m
    cpus: 0.5
    networks:
      - entitybase-network

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-fakekey}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-fakesecret}
      - MINIO_DEFAULT_BUCKETS=entitybase
    volumes:
      - ${VOLUMES_PATH}/minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.5
    networks:
      - entitybase-network

  valkey:
    image: valkey/valkey:latest
    container_name: valkey
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - entitybase-network

  redpanda:
    image: redpandadata/redpanda:v25.3.6
    container_name: redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp 1
      - --memory 256M
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    environment:
      - KAFKA_RETENTION_BYTES=${REDPANDA_RETENTION_BYTES:-10485760}
      - KAFKA_RETENTION_MS=${REDPANDA_RETENTION_MS:-3600000}
      - KAFKA_LOG_SEGMENT_BYTES=${REDPANDA_LOG_SEGMENT_BYTES:-10485760}
      - REDPANDA_LOG_SEGMENT_MAX_BYTES=${REDPANDA_LOG_SEGMENT_BYTES:-10485760}
    # ports:
    #   - "9092:9092"
    #   - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health && rpk topic list"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    cpus: 0.25
    networks:
      - entitybase-network
    user: ${REDPANDA_USER}
    volumes:
      - ${VOLUMES_PATH}/redpanda-data:/var/lib/redpanda/data

  entitybase-api:
    container_name: entitybase-api
    image: entitybase-api:latest
    ports:
      - "8083:8080"
    environment:
      - VERSION=${VERSION_ENTITYBASE_BACKEND}
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-fakekey}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-fakesecret}
      - S3_BUCKET=entitybase
      - VITESS_HOST=mysql
      - VITESS_PORT=3306
      - VITESS_DATABASE=entitybase
      - VITESS_USER=root
      - VITESS_PASSWORD=${MYSQL_ROOT_PASSWORD:-}
      - STREAMING_ENABLED=true
      - STREAMING_BACKEND=redpanda
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - KAFKA_ENTITYCHANGE_JSON_TOPIC=${KAFKA_ENTITY_CHANGE_TOPIC:-entity_change}
      - KAFKA_ENTITY_DIFF_TOPIC=${KAFKA_ENTITY_DIFF_TOPIC:-entity_diff}
      - KAFKA_USERCHANGE_JSON_TOPIC=user_change
      - KAFKA_ENDORSEMENT_TOPIC=endorsement
      - KAFKA_THANKS_TOPIC=thanks
      - ELASTICSEARCH_ENABLED=${ELASTICSEARCH_ENABLED:-false}
      - MEILISEARCH_ENABLED=${MEILISEARCH_ENABLED:-false}
      - ID_WORKER_ENABLED=${ID_WORKER_ENABLED:-true}
      - JSON_WORKER_ENABLED=${JSON_WORKER_ENABLED:-false}
      - TTL_WORKER_ENABLED=${TTL_WORKER_ENABLED:-false}
      - STATS_WORKER_ENABLED=${STATS_WORKER_ENABLED:-false}
      - PURGE_WORKER_ENABLED=${PURGE_WORKER_ENABLED:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      minio:
        condition: service_healthy
      mysql:
        condition: service_healthy
    command: python -m models.rest_api.main
    # Long start_period needed to initialize redpanda producers when STREAMING_ENABLED=true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 100s
    mem_limit: 1g
    cpus: 1.0
    networks:
      - entitybase-network

  kafka2sse-backend:
    container_name: kafka2sse-backend
    image: kafka2sse-backend:latest
    ports:
      - "8888:8888"
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - VALKEY_HOST=valkey
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - VERSION=${VERSION_KAFKA2SSE_BACKEND}
    depends_on:
      redpanda:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8888/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    cpus: 0.5
    networks:
      - entitybase-network

  orchestrator-frontend:
    container_name: orchestrator-frontend
    image: entitybase-orchestrator-frontend:latest
    ports:
      - "8080:8083"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      entitybase-api:
        condition: service_started
      kafka2sse-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8083/health.html"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 256m
    cpus: 0.25
    networks:
      - entitybase-network

networks:
  entitybase-network:
    name: entitybase-network

volumes:
  redpanda-data:
  minio-data:
  meilisearch-data:
