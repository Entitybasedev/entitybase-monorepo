# Entitybase Docker Orchestration
#
# Ports:
#   mysql:            3306
#   redpanda:         9092 (Kafka), 9644 (admin)
#   entitybase-api:   8083
#   kafka2sse-be:     8888
#
# Usage:
#   just up           # build images and start everything
#   docker compose up -d

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: entitybase
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    healthcheck:
      test: ["CMD", "mysql", "-uroot", "-p${MYSQL_ROOT_PASSWORD}", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 512m
    cpus: 0.5
    networks:
      - entitybase-network

  valkey:
    image: valkey/valkey:latest
    container_name: valkey
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - entitybase-network

  redpanda:
    image: redpandadata/redpanda:v25.3.6
    container_name: redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp 1
      - --memory 256M
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    environment:
      - KAFKA_RETENTION_BYTES=${REDPANDA_RETENTION_BYTES:-10485760}
      - KAFKA_RETENTION_MS=${REDPANDA_RETENTION_MS:-3600000}
      - KAFKA_LOG_SEGMENT_BYTES=${REDPANDA_LOG_SEGMENT_BYTES:-10485760}
      - REDPANDA_LOG_SEGMENT_MAX_BYTES=${REDPANDA_LOG_SEGMENT_BYTES:-10485760}
    # ports:
    #   - "9092:9092"
    #   - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health && rpk topic list"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    cpus: 0.25
    networks:
      - entitybase-network
    user: ${REDPANDA_USER:-root}
    volumes:
      - ${VOLUMES_PATH}/redpanda-data:/var/lib/redpanda/data

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: meilisearch
    environment:
      # No master key: the stack runs without search auth. Set
      # MEILI_MASTER_KEY and MEILISEARCH_API_KEY for a protected instance.
      MEILI_ENV: development
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - entitybase-network

  entitybase-api:
    container_name: entitybase-api
    image: entitybase-api:latest
    ports:
      - "8083:8080"
    environment:
      - VERSION=${VERSION_ENTITYBASE_BACKEND}
      - DB_TYPE=mariadb
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=entitybase
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-}
      - STREAMING_ENABLED=true
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_ENTITY_CHANGE_TOPIC=${KAFKA_ENTITY_CHANGE_TOPIC:-entity_change}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - AUTH_TOKEN_EXPIRY_HOURS=${AUTH_TOKEN_EXPIRY_HOURS:-168}
      # Import a small demo dataset (1 item, 1 property, 1 lexeme) when the
      # instance is empty, so a fresh demo stack is not blank
      - DEMO_SEED_ENABLED=${DEMO_SEED_ENABLED:-true}
      # Search: the API reads the Meilisearch index the indexer worker writes
      - MEILISEARCH_ENABLED=true
      - MEILISEARCH_HOST=meilisearch
      - MEILISEARCH_PORT=7700
      - MEILISEARCH_INDEX=entitybase
    depends_on:
      mysql:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    # Long start_period needed to initialize redpanda producers when STREAMING_ENABLED=true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 100s
    mem_limit: 1g
    cpus: 1.0
    # The api races mysql's TCP listener on recreations; retry until it accepts
    restart: unless-stopped
    networks:
      - entitybase-network

  entitybase-frontend:
    container_name: entitybase-frontend
    image: entitybase-frontend:latest
    # Without this, `docker compose up -d` runs whatever entitybase-frontend:latest
    # happens to exist and silently ignores frontend source changes, because the
    # Vue app is baked into the image at build time. CI hides the problem by
    # running `npm run dev` instead of an image. Building here makes
    # `docker compose up -d --build` do the obvious thing.
    build:
      context: entitybase-frontend
    ports:
      - "8080:8080"
    depends_on:
      entitybase-api:
        condition: service_started
      kafka2sse-backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 128m
    cpus: 0.25
    networks:
      - entitybase-network

  kafka2sse-backend:
    container_name: kafka2sse-backend
    image: kafka2sse-backend:latest
    ports:
      - "8888:8888"
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - VALKEY_HOST=valkey
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - VERSION=${VERSION_KAFKA2SSE_BACKEND}
    depends_on:
      redpanda:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8888/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    cpus: 0.5
    networks:
      - entitybase-network

  # A DokuWiki with the Entitybase plugin, for writing documentation that
  # refers to items: {{entity>Q42}} renders the item's label.
  dokuwiki:
    container_name: dokuwiki
    image: dokuwiki/dokuwiki:stable
    # /var/www/html/{conf,lib/plugins} are symlinks into /storage, so the
    # read-only mounts below land inside /storage, which stops the image's own
    # entrypoint twice over: as root it chowns all of /storage under set -e and
    # dies on those read-only files, and as 33:33 it cannot mkdir /storage/data
    # in the root-owned directory the image ships. Prepare /storage the way the
    # root branch does, minus the abort, then drop privileges for the setup
    # script. The read-only mounts are the only thing the chown cannot do, and
    # nothing ever writes to them. This is what the dokuwiki-plugin CI job does.
    entrypoint:
      - sh
      - -c
      - |
        chown -R www-data:www-data /storage 2> /dev/null || true
        setpriv --reuid=33 --regid=33 --init-groups /dokuwiki-storagesetup.sh
        exec docker-php-entrypoint apache2-foreground
    ports:
      - "8082:8080"
    volumes:
      # The plugin, and the settings that point it at the API. Mounting
      # local.php replaces the one the wiki generates, which is what makes this
      # work without a manual install step.
      - ./plugin-dokuwiki/entitybase:/var/www/html/lib/plugins/entitybase:ro
      - ./plugin-dokuwiki/dokuwiki/local.php:/var/www/html/conf/local.php:ro
    depends_on:
      entitybase-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 256m
    cpus: 0.25
    networks:
      - entitybase-network

  # Turns entity changes into RDF diffs on the stream. QLever follows that
  # topic, so this is what puts anything into the SPARQL endpoint at all.
  incremental-rdf-worker:
    container_name: incremental-rdf-worker
    build:
      context: .
      dockerfile: incremental_rdf_worker/Dockerfile
    environment:
      - DB_TYPE=mariadb
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=entitybase
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-}
      - STREAMING_ENABLED=true
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_ENTITY_CHANGE_TOPIC=${KAFKA_ENTITY_CHANGE_TOPIC:-entity_change}
      - INCREMENTAL_RDF_ENABLED=true
      - KAFKA_INCREMENTAL_RDF_TOPIC=${KAFKA_INCREMENTAL_RDF_TOPIC:-incremental_rdf_diff}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      entitybase-api:
        condition: service_started
      redpanda:
        condition: service_healthy
    restart: on-failure
    mem_limit: 512m
    cpus: 0.5
    networks:
      - entitybase-network

  # A SPARQL endpoint over the same data, kept current by following the change
  # stream. The index starts empty and is filled from the stream, so it holds
  # everything the RDF diffs have carried since the topic was created.
  qlever:
    container_name: qlever
    image: adfreiburg/qlever:latest
    # The image's own entrypoint only rewrites the qlever user's uid, which
    # fails outright for UID=0 ("UID '0' already exists"), so bypass it and run
    # as root instead. /data is a named volume this stack owns anyway.
    user: "0:0"
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    # The image works in /qlever, where there is no Qleverfile and where the
    # index files would be written inside the container instead of into the
    # volume. Qlever reads its configuration from the working directory.
    working_dir: /data
    environment:
      - QLEVER_PORT=7019
      - QLEVER_STREAM_TOPIC=${KAFKA_INCREMENTAL_RDF_TOPIC:-incremental_rdf_diff}
    volumes:
      # QLever reads Qleverfile from its working directory and keeps the index
      # beside it, so the two live in /data.
      - ./qlever/Qleverfile:/data/Qleverfile:ro
      - ./qlever/entrypoint.sh:/entrypoint.sh:ro
      - qlever-data:/data
    ports:
      - "8081:7019"
    depends_on:
      kafka2sse-backend:
        condition: service_started
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:7019/ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    mem_limit: 1g
    cpus: 1
    networks:
      - entitybase-network

# The QLever UI, a separate image from the endpoint it queries. Seeds its own
  # backend row on start, because a fresh install has none and would otherwise
  # come up with nothing to query.
  qlever-ui:
    container_name: qlever-ui
    image: adfreiburg/qlever-ui:latest
    user: "0:0"
    entrypoint: ["/bin/sh", "/ui-entrypoint.sh"]
    environment:
      # The browser calls the endpoint, not this container, so the URL has to be
      # the one the browser can reach rather than a compose service name.
      - QLEVER_BACKEND_URL=http://localhost:8081
    volumes:
      - ./qlever/ui-entrypoint.sh:/ui-entrypoint.sh:ro
      - qlever-ui-data:/app/db
    ports:
      - "8086:7000"
    depends_on:
      qlever:
        condition: service_started
    healthcheck:
      # Reads the port the entrypoint was given rather than repeating it, so the
      # probe follows the change if the served port is ever overridden.
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${QLEVER_UI_PORT:-7000}/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    mem_limit: 512m
    cpus: 0.5
    networks:
      - entitybase-network

  meilisearch-indexer-worker:
    container_name: meilisearch-indexer-worker
    build:
      context: .
      dockerfile: meilisearch_indexer_worker/Dockerfile
    ports:
      - "8009:8009"
    environment:
      - MEILISEARCH_ENABLED=true
      - MEILISEARCH_HOST=meilisearch
      - MEILISEARCH_PORT=7700
      - MEILISEARCH_INDEX=entitybase
      - MEILISEARCH_CONSUMER_GROUP=entitybase-meilisearch-indexer
      # The index starts empty: index what already exists before following the
      # change stream, so search works right after startup
      - MEILISEARCH_REINDEX_ON_START=true
      - DB_TYPE=mariadb
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=entitybase
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-}
      - STREAMING_ENABLED=true
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_ENTITY_CHANGE_TOPIC=${KAFKA_ENTITY_CHANGE_TOPIC:-entity_change}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      entitybase-api:
        condition: service_started
      meilisearch:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8009/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    networks:
      - entitybase-network

networks:
  entitybase-network:
    name: entitybase-network

volumes:
  redpanda-data:
  # QLever's index. Named rather than a bind mount so `docker compose down -v`
  # resets it along with the rest of the data.
  qlever-data:
  # The UI's sqlite database, which is where it keeps its backend list.
  qlever-ui-data:
