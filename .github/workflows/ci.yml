name: CI Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workers-test:
    name: worker tests (${{ matrix.worker }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Not covered for now:
        #  - elasticsearch_indexer_worker: needs Elasticsearch, which CI does not run
        #  - general_stats_worker, user_stats_worker, backlink_statistics_worker:
        #    the statistics workers, disabled for now
        worker:
          - json_dump_worker
          - ttl_dump_worker
          - entity_diff_worker
          - incremental_rdf_worker
          - notification_cleanup_worker
          - watchlist_consumer_worker
          - meilisearch_indexer_worker
    defaults:
      run:
        working-directory: ${{ matrix.worker }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The worker depends on the backend package for its data layer
      - run: uv sync --group dev
      - name: Run worker unit tests
        run: uv run pytest -q --ignore=tests/integration

  entitybase-backend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: entitybase-backend
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: uv sync --group dev
      - name: Run custom linters
        run: |
          uv run python scripts/linters/check_async_calls.py src/
          uv run python scripts/linters/check_int_fields.py src/
          uv run python scripts/linters/value_error_linter.py
          bash scripts/shell/run-assert-linter.sh
          bash scripts/shell/run-response-model-lint.sh
          bash scripts/shell/run-logger-lint.sh
          bash scripts/shell/run-long-files-lint.sh
          bash scripts/shell/run-dict-lint.sh
          bash scripts/shell/run-pydantic-field-lint.sh
          bash scripts/shell/run-any-lint.sh
          bash scripts/shell/run-tuple-lint.sh
          bash scripts/shell/run-key-length-lint.sh
          bash scripts/shell/run-init-lint.sh
          bash scripts/shell/run-backslash-lint.sh
          bash scripts/shell/run-json-lint.sh
          bash scripts/shell/run-status-code-lint.sh
      - name: Run external linters
        run: |
          uv run ruff check src/
          uv run radon cc src/ -n 11 -x 20 -e ".venv"
          uv run mypy src/

  entitybase-backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: entitybase-backend-lint
    defaults:
      run:
        working-directory: entitybase-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # === UNIT TESTS (no Docker) ===
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: uv sync --group dev
      - name: Run unit tests (01 - config, data, services, validation, json_parser)
        run: uv run pytest tests/unit -k "config or data or services or validation or json_parser" -v --tb=short --cov=src --cov-branch --cov-report=xml --cov-report=term --cov-append
        timeout-minutes: 10
      - name: Run unit tests (02 - internal_representation, workers)
        run: uv run pytest tests/unit -k "internal_representation or workers" -v --tb=short --cov=src --cov-branch --cov-report=xml --cov-report=term --cov-append
        timeout-minutes: 10
      - name: Run unit tests (03 - infrastructure, rdf_builder)
        run: uv run pytest tests/unit -k "infrastructure or rdf_builder" -v --tb=short --cov=src --cov-branch --cov-report=xml --cov-report=term --cov-append
        timeout-minutes: 10
      - name: Run unit tests (04 - rest_api)
        run: uv run pytest tests/unit -k "rest_api" -v --tb=short --cov=src --cov-branch --cov-report=xml --cov-report=term --cov-append
        timeout-minutes: 10

      # === SERVICES FOR INTEGRATION TESTS ===
      - name: Start mysql and rustfs
        working-directory: ${{ github.workspace }}
        run: |
          docker compose -f entitybase-backend/docker-compose.ci.yml up -d \
            mysql rustfs
      - name: Wait for MySQL
        working-directory: ${{ github.workspace }}
        timeout-minutes: 2
        run: |
          until docker compose -f entitybase-backend/docker-compose.ci.yml exec -T mysql mysqladmin ping -h localhost --silent; do
            echo "Waiting for MySQL..."; sleep 2
          done
      - name: Wait for RustFS
        working-directory: ${{ github.workspace }}
        timeout-minutes: 2
        run: |
          until curl -f http://localhost:9000/health; do
            echo "Waiting for RustFS..."; sleep 2
          done

      # === CONTRACT TESTS ===
      - name: Run contract tests
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_DATABASE: entitybase
          DB_USER: root
          DB_PASSWORD: ""
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: fakekey
          S3_SECRET_KEY: fakesecret
          S3_BUCKET: testbucket
          REST_API_URL: http://localhost:8000
        run: uv run pytest tests/contract/ -v -m contract --tb=short --cov=src --cov-branch --cov-report=xml --cov-report=term --cov-append --junitxml=junit.xml -o junit_family=legacy
        timeout-minutes: 10

      # === INTEGRATION TESTS ===
      - name: Run integration tests (01 - first 50)
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_DATABASE: entitybase
          DB_USER: root
          DB_PASSWORD: ""
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: fakekey
          S3_SECRET_KEY: fakesecret
          S3_BUCKET: testbucket
          REST_API_URL: http://localhost:8000
        run: uv run pytest tests/integration -k "test_app or test_id_resolver or test_connection_pool" -v --tb=short --cov=src --cov-branch --cov-report=xml --cov-report=term --cov-append
        timeout-minutes: 10

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: integration
          name: integration-tests

      - name: Run integration tests (02 - mid 50)
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_DATABASE: entitybase
          DB_USER: root
          DB_PASSWORD: ""
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: fakekey
          S3_SECRET_KEY: fakesecret
          S3_BUCKET: testbucket
          REST_API_URL: http://localhost:8000
        run: uv run pytest tests/integration -k "test_watchlist or test_entity_deletion or test_item_terms" -v --tb=short --cov=src --cov-branch --cov-report=xml --cov-report=term --cov-append
        timeout-minutes: 10

      - name: Run integration tests (03 - late 50a)
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_DATABASE: entitybase
          DB_USER: root
          DB_PASSWORD: ""
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: fakekey
          S3_SECRET_KEY: fakesecret
          S3_BUCKET: testbucket
          REST_API_URL: http://localhost:8000
        run: uv run pytest tests/integration -k "test_json_import or test_lexeme or test_entity_base or test_json_parser or test_rest_api" -v --tb=short --cov=src --cov-branch --cov-report=xml --cov-report=term --cov-append
        timeout-minutes: 10

      - name: Run integration tests (04 - late 50b)
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_DATABASE: entitybase
          DB_USER: root
          DB_PASSWORD: ""
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: fakekey
          S3_SECRET_KEY: fakesecret
          S3_BUCKET: testbucket
          REST_API_URL: http://localhost:8000
        run: uv run pytest tests/integration -k "test_cas_update or test_create_revision or test_create_with_cas or test_entity_history or test_entity_retrieval or test_get_content_hash or test_get_head_revision or test_hard_delete or test_insert_revision or test_read_revision or test_soft_delete" -v --tb=short --cov=src --cov-branch --cov-report=xml --cov-report=term --cov-append
        timeout-minutes: 10

      - name: Upload total coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: total
          name: total-coverage

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            pytest-report.html
            pytest-report.json
            .coverage
            coverage.xml
          if-no-files-found: ignore
  e2e-ui:
    # Playwright e2e against the REAL backend stack (never the mock API).
    # Runs unconditionally, in parallel with the other test jobs.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_URL: http://localhost:8000
      API_TARGET: http://localhost:8000
      FRONTEND_PORT: 8085
      DOKUWIKI_PORT: 8082
      DOKUWIKI_URL: http://localhost:8082
    defaults:
      run:
        working-directory: e2e-ui
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build backend images
        working-directory: ${{ github.workspace }}
        run: |
          docker compose -f entitybase-backend/docker-compose.ci.yml build api
          docker compose -f entitybase-backend/docker-compose.ci.yml build meilisearch-indexer-worker
      - name: Start backend stack
        working-directory: ${{ github.workspace }}
        run: |
          docker compose -f entitybase-backend/docker-compose.ci.yml up -d \
            mysql rustfs redpanda meilisearch api meilisearch-indexer-worker

      - name: Wait for MySQL
        timeout-minutes: 2
        working-directory: ${{ github.workspace }}
        run: |
          until docker compose -f entitybase-backend/docker-compose.ci.yml exec -T mysql mysqladmin ping -h localhost --silent; do
            echo "Waiting for MySQL..."; sleep 2
          done
      - name: Wait for RustFS
        timeout-minutes: 2
        run: |
          until curl -f http://localhost:9000/health; do
            echo "Waiting for RustFS..."; sleep 2
          done
      - name: Wait for Meilisearch
        timeout-minutes: 2
        working-directory: ${{ github.workspace }}
        run: |
          until curl -f http://localhost:7700/health; do
            echo "Waiting for Meilisearch..."; sleep 2
          done
      - name: Create S3 bucket
        working-directory: ${{ github.workspace }}
        run: |
          docker compose -f entitybase-backend/docker-compose.ci.yml run --rm --entrypoint "" api python -c "
          import boto3, os
          s3 = boto3.client('s3', endpoint_url=os.environ['S3_ENDPOINT'], aws_access_key_id=os.environ['S3_ACCESS_KEY'], aws_secret_access_key=os.environ['S3_SECRET_KEY'])
          bucket = os.environ['S3_BUCKET']
          try:
              s3.head_bucket(Bucket=bucket)
              print('bucket exists:', bucket)
          except Exception:
              s3.create_bucket(Bucket=bucket)
              print('bucket created:', bucket)
          "
      - name: Wait for API
        timeout-minutes: 5
        run: |
          for i in $(seq 1 60); do
            if curl -f http://localhost:8000/health 2>/dev/null; then
              exit 0
            fi
            if [ $((i % 10)) -eq 0 ]; then
              echo "--- api container status (attempt $i) ---"
              docker compose -f ../entitybase-backend/docker-compose.ci.yml ps
              docker compose -f ../entitybase-backend/docker-compose.ci.yml logs --tail=30 api
            fi
            sleep 5
          done
          echo "API did not become healthy in time; dumping logs:"
          docker compose -f ../entitybase-backend/docker-compose.ci.yml logs api
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Python + uv for stream backend
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"

      - name: Start valkey for stream backend
        run: |
          docker run -d --name valkey -p 6379:6379 valkey/valkey:latest
          for i in $(seq 1 15); do
            if docker exec valkey valkey-cli ping 2>/dev/null | grep -q PONG; then
              echo "valkey ready"; exit 0
            fi
            sleep 2
          done
          echo "valkey did not become ready"; exit 1

      - name: Start kafka2sse backend
        working-directory: ${{ github.workspace }}/kafka2sse-backend
        run: |
          # Reuses the redpanda already running from the backend stack on localhost:9092
          VALKEY_HOST=localhost VALKEY_PORT=6379 KAFKA_BROKERS=localhost:9094 \
            nohup uv run uvicorn src.main:app --host 0.0.0.0 --port 8888 > /tmp/k2s.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8888/health > /dev/null; then
              echo "kafka2sse backend ready"; exit 0
            fi
            sleep 2
          done
          echo "kafka2sse backend did not become healthy"; cat /tmp/k2s.log; exit 1

      - name: Create entity_change topic
        working-directory: ${{ github.workspace }}
        run: |
          docker compose -f entitybase-backend/docker-compose.ci.yml exec -T redpanda \
            rpk topic create entity_change 2>/dev/null || echo "topic exists"
          docker compose -f entitybase-backend/docker-compose.ci.yml exec -T redpanda \
            rpk topic list

      - name: Install e2e + frontend deps
        run: |
          npm install --silent
          npx playwright install --with-deps chromium
          (cd ../entitybase-frontend && npm install --silent)

      - name: Start frontend dev server
        working-directory: ${{ github.workspace }}/entitybase-frontend
        run: |
          nohup npm run dev > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:${{ env.FRONTEND_PORT }}/ > /dev/null; then
              echo "frontend dev server ready"; exit 0
            fi
            sleep 2
          done
          echo "frontend dev server did not become ready"; cat /tmp/frontend.log; exit 1

      - name: Start DokuWiki with the Entitybase plugin
        working-directory: ${{ github.workspace }}
        run: |
          # The wiki is a second UI over the same API, so it runs next to the
          # frontend for the tests that write a wiki article with {{entity>}}.
          # Its own /storage volume, chowned up front: see the dokuwiki-plugin
          # job for why the entrypoint cannot do that itself here.
          docker volume create dokuwiki-storage
          docker run --rm -u 0 -v dokuwiki-storage:/storage \
            --entrypoint chown dokuwiki/dokuwiki:stable -R 33:33 /storage
          docker run -d --name dokuwiki --user 33:33 \
            -p ${{ env.DOKUWIKI_PORT }}:8080 \
            -v dokuwiki-storage:/storage \
            -v "$PWD/plugin-dokuwiki/entitybase:/var/www/html/lib/plugins/entitybase:ro" \
            dokuwiki/dokuwiki:stable

          # The plugin needs its settings, but the mounted local.php from the
          # plugin directory points at the dev stack (entitybase-api:8080),
          # while this job runs the api as `api` on port 8000. Write the config
          # here instead, so both stacks run the same plugin with no mount.
          NETWORK=$(docker inspect api --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}')
          docker network connect "$NETWORK" dokuwiki
          until docker exec dokuwiki test -d /storage/conf; do sleep 1; done
          docker exec -i -u 33:33 dokuwiki sh -c 'cat > /storage/conf/local.php' <<PHPEOF
          <?php
          \$conf['plugin']['entitybase']['api'] = 'http://api:8000';
          \$conf['plugin']['entitybase']['entity_url'] = 'http://localhost:8085/entity';
          \$conf['plugin']['entitybase']['cache_ttl'] = 300;
          PHPEOF

      - name: Wait for DokuWiki
        timeout-minutes: 3
        working-directory: ${{ github.workspace }}
        run: |
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:${{ env.DOKUWIKI_PORT }}/" > /dev/null; then
              echo "DokuWiki is up"
              exit 0
            fi
            echo "Waiting for DokuWiki..."
            sleep 2
          done
          echo "DokuWiki did not come up"
          docker logs dokuwiki
          exit 1

      - name: Run Playwright e2e
        run: npx playwright test

      - name: Show API logs on failure
        if: failure()
        run: |
          docker compose -f ../entitybase-backend/docker-compose.ci.yml logs --tail=500 api | \
            grep -iE "producer|publish|kafka|Sending event|entity_change|Q300000000" || true
          docker compose -f ../entitybase-backend/docker-compose.ci.yml logs --tail=500 api > /tmp/api-full.log || true
      - name: Consume entity_change topic on failure
        if: failure()
        run: |
          echo "=== topic description ==="
          docker compose -f ../entitybase-backend/docker-compose.ci.yml exec -T redpanda \
            rpk topic describe entity_change || true
          echo "=== all messages in entity_change ==="
          timeout 30 docker compose -f ../entitybase-backend/docker-compose.ci.yml exec -T redpanda \
            rpk topic consume entity_change --offset-start 0 2>/dev/null || \
          timeout 30 docker compose -f ../entitybase-backend/docker-compose.ci.yml exec -T redpanda \
            rpk topic consume entity_change -o 0 || true
      - name: Show search stack logs on failure
        if: failure()
        working-directory: ${{ github.workspace }}
        run: |
          echo "=== meilisearch-indexer-worker ==="
          docker compose -f entitybase-backend/docker-compose.ci.yml logs --tail=200 \
            meilisearch-indexer-worker || true
          echo "=== meilisearch ==="
          docker compose -f entitybase-backend/docker-compose.ci.yml logs --tail=50 meilisearch || true
          echo "=== indexed documents ==="
          curl -sf "http://localhost:7700/indexes/entitybase/stats" || echo "no index yet"
          echo
          curl -sf "http://localhost:7700/indexes/entitybase/documents?limit=5" || true
      - name: Check frontend links
        if: always()
        working-directory: ${{ github.workspace }}
        run: ./scripts/check-links.sh frontend http://localhost:${{ env.FRONTEND_PORT }}
      - name: Down containers
        if: always()
        run: |
          docker compose -f ../entitybase-backend/docker-compose.ci.yml down -v
          docker rm -f dokuwiki || true
          docker volume rm -f dokuwiki-storage || true
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e-ui/playwright-report/
            e2e-ui/test-results/
          if-no-files-found: ignore

  dokuwiki-plugin:
    # The DokuWiki plugin, tested on the PHP that will actually run it.
    # The unit tests need no wiki, so they run inside the image for a real PHP
    # with curl and the file layout of a real install.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOKUWIKI_PORT: 8082
    steps:
      - uses: actions/checkout@v7

      - name: Run the plugin tests in the DokuWiki image
        run: |
          # --entrypoint php bypasses the image's entrypoint, which only chowns
          # the wiki directory and would fail on the read-only mounts
          docker run --rm --entrypoint php \
            -v "$PWD/plugin-dokuwiki:/plugin:ro" \
            dokuwiki/dokuwiki:stable \
            /plugin/tests/run.php

      - name: Start DokuWiki with the plugin
        run: |
          # /var/www/html/{conf,lib/plugins} are symlinks into /storage, so the
          # mounts below land inside /storage. Neither branch of the image's
          # entrypoint works with that: as root it chowns all of /storage and
          # dies on the read-only mounts, and as 33:33 it cannot create
          # /storage/data in the root-owned directory the image ships. So give
          # /storage its own volume, chown that, and start unprivileged: the
          # entrypoint then only writes inside a volume it owns.
          docker volume create dokuwiki-storage
          docker run --rm -u 0 -v dokuwiki-storage:/storage \
            --entrypoint chown dokuwiki/dokuwiki:stable -R 33:33 /storage
          docker run -d --name dokuwiki --user 33:33 \
            -p $DOKUWIKI_PORT:8080 \
            -v dokuwiki-storage:/storage \
            -v "$PWD/plugin-dokuwiki/entitybase:/var/www/html/lib/plugins/entitybase:ro" \
            -v "$PWD/plugin-dokuwiki/dokuwiki/local.php:/var/www/html/conf/local.php:ro" \
            dokuwiki/dokuwiki:stable

      - name: Wait for DokuWiki
        timeout-minutes: 3
        run: |
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:$DOKUWIKI_PORT/" > /dev/null; then
              echo "DokuWiki is up"
              exit 0
            fi
            echo "Waiting for DokuWiki..."
            sleep 2
          done
          echo "DokuWiki did not come up"
          docker logs dokuwiki
          exit 1

      - name: The plugin is installed in the wiki
        run: |
          docker exec dokuwiki test -f /var/www/html/lib/plugins/entitybase/syntax.php
          docker exec dokuwiki test -f /var/www/html/lib/plugins/entitybase/helper.php
          docker exec dokuwiki test -f /var/www/html/conf/local.php

      - name: The syntax renders
        # This job runs no Entitybase API, so the lookup cannot succeed. What is
        # worth proving here is that the plugin loads, the pattern matches, and
        # a failed lookup degrades to showing the id rather than breaking the
        # page. Every rendered item carries the entitybase-item class, with
        # entitybase-missing added when there was no label; the label path
        # itself is covered by the plugin's own tests.
        run: |
          docker exec -u 0 dokuwiki sh -c 'mkdir -p /storage/data/pages &&
            printf "====== Entitybase ======\n\nA plain item: {{entity>Q1}}\n" \
              > /storage/data/pages/entities.txt &&
            rm -rf /storage/data/cache/*'
          if ! curl -s "http://localhost:$DOKUWIKI_PORT/doku.php?id=entities" \
            | grep -q 'entitybase-item'; then
            echo "the plugin did not render the entity"
            docker exec -u 0 dokuwiki tail -20 /storage/data/log/error/$(date +%Y-%m-%d).log || true
            exit 1
          fi
          echo "the entity syntax renders"

      - name: Show DokuWiki logs on failure
        if: failure()
        run: docker logs dokuwiki

      - name: Down containers
        if: always()
        run: |
          docker rm -f dokuwiki || true
          docker volume rm -f dokuwiki-storage || true

  kafka2sse-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kafka2sse-backend
    steps:
      - uses: actions/checkout@v7

      - name: Start services
        run: docker compose up -d

      - name: Wait for redpanda
        timeout-minutes: 2
        run: |
          until docker compose exec -T redpanda rpk cluster health 2>/dev/null | grep -q 'Healthy'; do
            echo "Waiting for redpanda..."
            sleep 2
          done

      - name: Wait for valkey
        timeout-minutes: 2
        run: |
          until docker compose exec -T valkey valkey-cli ping 2>/dev/null | grep -q 'PONG'; do
            echo "Waiting for valkey..."
            sleep 2
          done

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --no-install-project

      - name: Run ruff
        run: uv run ruff check .

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Run integration tests
        run: timeout 60 uv run pytest tests/integration/ -v --cov=src --cov-report=term-missing --cov-report=xml || true

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: kafka2sse-backend

      - name: Stop services
        if: always()
        run: docker compose down

  entitybase-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: entitybase-frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: entitybase-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

